<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a86ea"/>
      <stop offset="1" stop-color="#0a57ac"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ad7ff"/>
      <stop offset="1" stop-color="#5a9bff"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#f2f6fb"/>
      <stop offset="0.6" stop-color="#cdd8e6"/>
      <stop offset="1" stop-color="#aab8cc"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded tile (dingz form factor) -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft top highlight -->
  <rect width="512" height="248" rx="116" fill="#ffffff" opacity="0.07"/>

  <!-- switch plate -->
  <rect x="132" y="84" width="248" height="344" rx="46" fill="url(#plate)"/>
  <!-- faint rocker seam (two halves) -->
  <rect x="160" y="251" width="192" height="5" rx="2.5" fill="#c9d4e2"/>

  <!-- sensor lens near the top -->
  <circle cx="256" cy="162" r="30" fill="url(#lens)"/>
  <circle cx="256" cy="162" r="13" fill="#8ea0b8"/>
  <circle cx="249" cy="155" r="5" fill="#ffffff" opacity="0.85"/>

  <!-- glowing front LED at the bottom -->
  <g filter="url(#glow)">
    <rect x="176" y="372" width="160" height="18" rx="9" fill="url(#led)"/>
  </g>
</svg>
