configuration:
  id_prefix:
    name: ID prefix
    description: Prefix of unique_ids and discovery topics. A different prefix (e.g. dingztest) creates a separate set of devices.
  name_prefix:
    name: Name prefix
    description: Prepended to every device name, e.g. "TEST ".
  http_enrichment:
    name: Read HTTP details
    description: Read device names, output names and output types from the dingz HTTP API.
  log_level:
    name: Log level
  update_check:
    name: Update check
    description: Show in the web UI whether a newer version is available on GitHub.
  temperature_filter:
    name: Temperature filter
    description: Drop the floored whole-degree values of the dingz periodic status dump (avoids a saw-tooth). The temperature sensor then needs the running bridge.
  mqtt_host:
    name: Broker address
    description: "Only for an external broker (no Mosquitto add-on): hostname or IP, e.g. 10.0.10.11. Empty = broker of the Mosquitto add-on."
  mqtt_port:
    name: Broker port
    description: "1883 without TLS, usually 8883 with TLS."
  mqtt_username:
    name: Broker user
  mqtt_password:
    name: Broker password
  mqtt_tls:
    name: Use TLS
    description: "Connect to the external broker via TLS. With an own CA also set the CA file."
  mqtt_ca_file:
    name: Broker CA file
    description: "Only for TLS with an own CA: path to the CA file (PEM), e.g. /ssl/mqtt-ca.pem."
  mqtt_tls_insecure:
    name: Do not verify TLS certificate
    description: "Testing only: do not verify the broker certificate with TLS."
