configuration:
  id_prefix:
    name: ID-Präfix
    description: Präfix für unique_ids und Discovery-Topics. Ein anderes Präfix (z. B. dingztest) legt einen separaten Satz Geräte an.
  name_prefix:
    name: Namens-Präfix
    description: Wird jedem Gerätenamen vorangestellt, z. B. "TEST ".
  http_enrichment:
    name: HTTP-Details lesen
    description: Gerätenamen, Ausgangsnamen und Ausgangstypen über die HTTP-API der dingz lesen.
  log_level:
    name: Log-Level
  update_check:
    name: Update-Check
    description: Auf der Weboberfläche anzeigen, ob auf GitHub eine neuere Version verfügbar ist.
  temperature_filter:
    name: Temperaturfilter
    description: Die auf ganze Grad abgerundeten Werte aus dem periodischen Statusdump der dingz verwerfen (verhindert ein Sägezahnmuster). Der Temperatursensor braucht dann die laufende Bridge.
  mqtt_host:
    name: Broker-Adresse
    description: "Nur für einen externen Broker (ohne Mosquitto-Add-on): Hostname oder IP, z. B. 10.0.10.11. Leer = Broker des Mosquitto-Add-ons."
  mqtt_port:
    name: Broker-Port
    description: "1883 ohne TLS, meist 8883 mit TLS."
  mqtt_username:
    name: Broker-Benutzer
  mqtt_password:
    name: Broker-Passwort
  mqtt_tls:
    name: TLS verwenden
    description: "Verbindung zum externen Broker per TLS. Bei eigener CA zusätzlich die CA-Datei angeben."
  mqtt_ca_file:
    name: CA-Datei des Brokers
    description: "Nur bei TLS mit eigener CA: Pfad zur CA-Datei (PEM), z. B. /ssl/mqtt-ca.pem."
  mqtt_tls_insecure:
    name: TLS-Zertifikat nicht prüfen
    description: "Nur zum Testen: Zertifikat des Brokers bei TLS nicht prüfen."
