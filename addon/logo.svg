<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a86ea"/>
      <stop offset="1" stop-color="#0a57ac"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ad7ff"/>
      <stop offset="1" stop-color="#5a9bff"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#f2f6fb"/>
      <stop offset="0.6" stop-color="#cdd8e6"/>
      <stop offset="1" stop-color="#aab8cc"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- icon mark -->
  <g transform="translate(20,20)">
    <rect width="160" height="160" rx="36" fill="url(#bg)"/>
    <rect width="160" height="78" rx="36" fill="#ffffff" opacity="0.07"/>
    <rect x="41" y="26" width="78" height="108" rx="15" fill="url(#plate)"/>
    <rect x="50" y="78" width="60" height="2" rx="1" fill="#c9d4e2"/>
    <circle cx="80" cy="51" r="10" fill="url(#lens)"/>
    <circle cx="80" cy="51" r="4.5" fill="#8ea0b8"/>
    <g filter="url(#glow)">
      <rect x="55" y="116" width="50" height="6" rx="3" fill="url(#led)"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="208" y="104" font-size="58" font-weight="700" fill="#1565c0">dingz</text>
    <text x="208" y="150" font-size="34" font-weight="400" fill="#5b6b7f" letter-spacing="0.5">HA Bridge</text>
  </g>
</svg>
