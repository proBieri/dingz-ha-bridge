<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a86ea"/>
      <stop offset="1" stop-color="#0a57ac"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ad7ff"/>
      <stop offset="1" stop-color="#5a9bff"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.42" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f2f6fb"/>
      <stop offset="0.6" stop-color="#cdd8e6"/>
      <stop offset="1" stop-color="#aab8cc"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- icon mark (same artwork as icon.svg, scaled to 160px) -->
  <g transform="translate(20,20) scale(0.3125)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect width="512" height="248" rx="116" fill="#ffffff" opacity="0.07"/>
    <rect x="132" y="84" width="248" height="344" rx="46" fill="url(#plate)"/>
    <g fill="#e9eff7" stroke="#c7d3e2" stroke-width="2.5">
      <rect x="154" y="110" width="70" height="70" rx="16"/>
      <rect x="288" y="110" width="70" height="70" rx="16"/>
      <rect x="154" y="332" width="70" height="70" rx="16"/>
      <rect x="288" y="332" width="70" height="70" rx="16"/>
    </g>
    <circle cx="256" cy="256" r="30" fill="url(#lens)"/>
    <circle cx="256" cy="256" r="13" fill="#8ea0b8"/>
    <circle cx="249" cy="249" r="5" fill="#ffffff" opacity="0.85"/>
    <g filter="url(#glow)">
      <rect x="166" y="248" width="50" height="16" rx="8" fill="url(#led)"/>
      <rect x="296" y="248" width="50" height="16" rx="8" fill="url(#led)"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="208" y="104" font-size="58" font-weight="700" fill="#1565c0">dingz</text>
    <text x="208" y="150" font-size="34" font-weight="400" fill="#5b6b7f" letter-spacing="0.5">HA Bridge</text>
  </g>
</svg>
