name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # Docker image for standalone use, multi-arch, runs as the unprivileged user "app":
  # ghcr.io/<owner, lowercase>/dingz-ha-bridge:<version>|latest
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # ghcr image names must be lowercase (owner is "proBieri").
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/dingz-ha-bridge:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/dingz-ha-bridge:latest

  # Add-on images, one per arch as the add-on expects them, running as root (RUN_AS=0):
  # ghcr.io/<owner, lowercase>/dingz-ha-bridge-{arch}:<version>|latest
  addon-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            RUN_AS=0
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/dingz-ha-bridge-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/dingz-ha-bridge-${{ matrix.arch }}:latest
