[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dingz-ha-bridge"
version = "0.1.1"
description = "Expose dingz switches publishing via MQTT to Home Assistant through MQTT discovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["aiomqtt>=2.3"]

[project.optional-dependencies]
ui = ["aiohttp>=3.10", "zeroconf>=0.136"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "jinja2>=3.1"]

[project.scripts]
dingz-ha-bridge = "dingz_ha_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dingz_ha_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a running MQTT broker"]
